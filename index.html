<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invitación de boda</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link id="fonts" rel="stylesheet">
  <style>
    html,body{margin:0;background:#E9E7E1;min-height:100%}
    .state{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;font-family:"Figtree",system-ui,sans-serif;color:#3E4060}
    .state h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:1.9rem;margin:0 0 8px;color:#16182B}
    .spinner{width:34px;height:34px;border:3px solid #DCDDE8;border-top-color:#A8325A;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:14px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .gate{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;text-align:center;padding:24px;color:#fff;background:rgba(16,18,36,.72);backdrop-filter:blur(8px);font-family:"Figtree",system-ui,sans-serif;cursor:pointer}
    .gate{transition:opacity .7s ease,backdrop-filter .7s ease}
    .inv.waiting .in,.inv.waiting .particles i{animation-play-state:paused}
    .gate.leaving{opacity:0;backdrop-filter:blur(0);pointer-events:none}
    .gate p{margin:0;letter-spacing:.24em;text-transform:uppercase;font-size:.72rem;opacity:.9}
    .gate h2{font:600 2.6rem/1.05 "Cormorant Garamond",Georgia,serif;margin:4px 0 14px}
    .gate button{padding:13px 28px;border-radius:999px;border:1.5px solid #fff;background:transparent;color:#fff;font:600 .9rem "Figtree",sans-serif;letter-spacing:.06em;cursor:pointer}
    .inv .music-btn{position:fixed;top:max(14px,env(safe-area-inset-top,0px));right:14px}
    .rsvp-slot form{display:flex;flex-direction:column;align-items:center;gap:14px;font-family:"Figtree",system-ui,sans-serif}
    .rsvp-slot .choices{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
    .rsvp-slot label.opt{position:relative;padding:10px 18px;border:1px solid #DCDDE8;border-radius:999px;cursor:pointer;font-size:.92rem;background:#fff}
    .rsvp-slot label.opt:has(input:checked){background:#A8325A;border-color:#A8325A;color:#fff}
    .rsvp-slot label.opt input{position:absolute;opacity:0;pointer-events:none}
    .rsvp-slot select{font:inherit;font-size:1rem;padding:9px 12px;border-radius:8px;border:1px solid #DCDDE8;background:#fff}
    .rsvp-slot .send{padding:12px 26px;border-radius:999px;border:0;background:#A8325A;color:#fff;font:600 .9rem "Figtree",sans-serif;cursor:pointer}
    .rsvp-slot .send:disabled{opacity:.6}
    .rsvp-slot .ghost{margin-top:14px;padding:9px 18px;border-radius:999px;border:1px solid #A8325A;background:transparent;color:#A8325A;font:500 .85rem "Figtree",sans-serif;cursor:pointer}
    .rsvp-slot .note-small{margin:10px 0 0;font-size:.82rem;color:#5E6180}
    .rsvp-slot form .note-small{margin:0}
    .rsvp-slot .msg{min-height:1.2em;margin:0;font-size:.85rem}
    .rsvp-slot .msg.err{color:#A3302A}
    .rsvp-slot .done{font:500 1.25rem/1.4 "Cormorant Garamond",Georgia,serif;margin:0}
  </style>
</head>
<body>
  <div id="app"><div class="state"><div class="spinner"></div><p>Cargando tu invitación…</p></div></div>
  <script src="common.js?v=20261029-1"></script>
  <script>
    document.getElementById("fonts").href = FONTS_HREF;
    const style = document.createElement("style");
    style.textContent = INVITATION_CSS;
    document.head.appendChild(style);

    const app = document.getElementById("app");
    const qs = new URLSearchParams(location.search);
    // Si al copiar o reenviar el link se le pega texto (un comentario, un emoji, un punto),
    // nos quedamos solo con la parte válida: el nombre de la boda y el código de 24 caracteres.
    const slug = ((qs.get("b") || "").toLowerCase().match(/^[a-z0-9]+(-[a-z0-9]+)*/) || [""])[0];
    const token = ((qs.get("g") || "").match(/^[A-Za-z0-9]+/) || [""])[0].slice(0, 24);

    function fail(title, text) {
      app.innerHTML = `<div class="state"><h1>${esc(title)}</h1><p>${esc(text)}</p></div>`;
    }

    function rsvpHtml(g) {
      if (g.rsvp === "si" || g.rsvp === "no") {
        const text = g.rsvp === "si"
          ? `¡Gracias! Confirmaste ${plural(g.rsvp_pases)}.`
          : "Gracias por avisarnos. Te vamos a extrañar.";
        return `<h2>Confirmación</h2><p class="done">${text}</p><p class="note-small">Si necesitas cambiar tu respuesta, avísales a los novios.</p>`;
      }
      const opts = Array.from({ length: g.pases }, (_, i) => i + 1)
        .map((n) => `<option value="${n}" ${n === g.pases ? "selected" : ""}>${plural(n)}</option>`)
        .join("");
      return `<h2>Confirma tu asistencia</h2>
        <form>
          <div class="choices">
            <label class="opt"><input type="radio" name="r" value="si" checked> Sí asistiré</label>
            <label class="opt"><input type="radio" name="r" value="no"> No podré ir</label>
          </div>
          <select name="pases" aria-label="Pases que usarás">${opts}</select>
          <p class="note-small">Tu respuesta es definitiva; revísala antes de enviar.</p>
          <button class="send" type="submit">Enviar respuesta</button>
          <p class="msg" role="status"></p>
        </form>`;
    }

    function mountRsvp(slot, g) {
      slot.innerHTML = rsvpHtml(g);
      const form = slot.querySelector("form");
      if (!form) return;
      const sel = form.querySelector("select");
      form.addEventListener("change", () => (sel.hidden = form.r.value !== "si"));
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const resumen = form.r.value === "si" ? `que asistirás con ${plural(Number(sel.value))}` : "que no podrás asistir";
        if (!confirm(`¿Confirmas ${resumen}? Después ya no podrás cambiarla desde aquí.`)) return;
        const msg = form.querySelector(".msg");
        const btn = form.querySelector(".send");
        btn.disabled = true;
        msg.className = "msg";
        msg.textContent = "Enviando…";
        try {
          const r = await api({ action: "rsvp", slug, token, rsvp: form.r.value, pases: Number(sel.value) });
          mountRsvp(slot, { ...g, rsvp: r.rsvp, rsvp_pases: r.rsvp_pases });
        } catch (err) {
          msg.className = "msg err";
          msg.textContent = err.message;
          btn.disabled = false;
        }
      });
    }

    async function main() {
      if (!slug || !token) return fail("Invitación no encontrada", "Abre el link completo que te enviaron por WhatsApp.");
      let data;
      try {
        data = await api({ action: "get", slug, token });
      } catch (err) {
        return fail("No pudimos abrir tu invitación", err.message);
      }
      const c = normalizeConfig(data.boda.config);
      const g = data.invitado;
      document.title = `${coupleShort(c) || "Nuestra boda"} · Invitación`;

      const player = createPlayer();
      player.set(c);
      app.innerHTML = renderInvitation(c, g);
      // La portada espera quieta detrás de "Toca para entrar" y se anima al tocar.
      const inv = app.querySelector(".inv");
      inv.classList.add("waiting");
      wireInvitation(app, c, player);
      mountRsvp(app.querySelector(".rsvp-slot"), g);

      // El navegador solo deja sonar música después de un toque.
      const gate = document.createElement("div");
      gate.className = "gate";
      gate.innerHTML = `<p>Estás invitado a la boda de</p><h2>${esc(coupleShort(c))}</h2><button type="button">Toca para entrar</button>`;
      gate.onclick = () => {
        gate.onclick = null;
        player.play();
        gate.classList.add("leaving");
        inv.classList.remove("waiting");
        setTimeout(() => gate.remove(), 700);
      };
      document.body.appendChild(gate);
    }
    main();
  </script>
</body>
</html>
