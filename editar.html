<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Editor de invitaciones</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link id="fonts" rel="stylesheet">
  <style>
    :root{--bg:#F4F4F8;--surface:#FFFFFF;--fg:#16182B;--muted:#5E6180;--line:#DCDDE8;--accent:#A8325A;--accent-fg:#FFFFFF;--accent-soft:#F6E3EA;--ok:#1E7A55;--warn:#9A5B00;--err:#B3261E;color-scheme:light}
    @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#101224;--surface:#191C33;--fg:#EDEEF7;--muted:#9A9DBD;--line:#2C3052;--accent:#E2678F;--accent-fg:#1A0A12;--accent-soft:#3A1F2C;--ok:#5ACB9A;--warn:#E7B062;--err:#F2827A;color-scheme:dark}}
    :root[data-theme="dark"]{--bg:#101224;--surface:#191C33;--fg:#EDEEF7;--muted:#9A9DBD;--line:#2C3052;--accent:#E2678F;--accent-fg:#1A0A12;--accent-soft:#3A1F2C;--ok:#5ACB9A;--warn:#E7B062;--err:#F2827A;color-scheme:dark}
    *{box-sizing:border-box}
    [hidden]{display:none!important}
    body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;padding:0 max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
    .app{max-width:1160px;margin:0 auto}

    .topbar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 0;background:var(--bg);border-bottom:1px solid var(--line);margin-bottom:22px}
    .topbar .title{flex:1;min-width:200px}
    h1{font:600 30px/1.1 'Cormorant Garamond',Georgia,serif;margin:0;text-wrap:balance}
    .status{font-size:13px;color:var(--muted)}
    .badge{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:3px 9px;border-radius:999px;margin-right:6px}
    .status.dirty{color:var(--warn)}
    .status.err{color:var(--err)}
    .topbar .actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

    .tabs{flex-basis:100%;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:2px -2px -13px}
    .tabs::-webkit-scrollbar{display:none}
    .tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;color:var(--muted);padding:10px 12px;font-weight:600}
    .tabs button:hover{color:var(--fg);border-color:transparent;border-bottom-color:var(--line)}
    .tabs button[aria-current=true]{color:var(--accent);border-bottom-color:var(--accent)}
    .seg.wrap{flex-wrap:wrap}
    .msgcfg{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;padding:14px;margin-bottom:16px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
    .msgcfg .field{flex:0 1 280px}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
    .editor{display:grid;gap:16px;min-width:0}
    .preview-col{position:sticky;top:var(--top-h,130px);min-width:0;max-height:calc(100vh - var(--top-h,130px) - 16px);overflow-y:auto;border-radius:10px}

    .panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
    .panel h2{font:600 12px/1 'Figtree',sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
    .stack{display:grid;gap:12px}
    .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
    .field{display:grid;gap:5px;min-width:0}
    .field>label,.lbl{font-size:13px;font-weight:500;color:var(--muted)}
    input[type=text],input[type=url],input[type=password],input[type=search],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:9px 11px;min-width:0}
    textarea{resize:vertical;min-height:64px}
    input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible,.upload:focus-within{outline:2px solid var(--accent);outline-offset:2px}
    .addr{font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);background:var(--bg);border:1px dashed var(--line);border-radius:7px;padding:8px 11px;overflow-wrap:anywhere}

    button,.btn,.upload{font:inherit;font-weight:500;cursor:pointer;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 13px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
    button:hover,.btn:hover,.upload:hover{border-color:var(--accent)}
    button:disabled{opacity:.55;cursor:default}
    .primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
    .primary:hover{filter:brightness(1.06)}
    .quiet{border-color:transparent;background:transparent;color:var(--muted);padding:6px 8px}
    .quiet:hover{color:var(--accent);border-color:transparent}
    .upload{position:relative}
    .upload input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

    .swatches{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
    .sw{width:52px;height:52px;padding:0;border-radius:9px;border:2px solid var(--line)}
    .sw[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
    .seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;width:max-content;max-width:100%}
    .seg button{border:0;border-radius:0;background:var(--bg)}
    .seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg)}
    .range{display:flex;align-items:center;gap:12px}
    .range input{flex:1;accent-color:var(--accent);min-width:0}
    .range output{min-width:4ch;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
    .check{display:flex;align-items:center;gap:8px;font-size:14px}
    .check input{accent-color:var(--accent);width:16px;height:16px}
    .hint{font-size:13px;color:var(--muted);margin:0}
    .hint.err{color:var(--err)}

    .srow{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:10px}
    .srow .field{flex:0 0 130px}
    .srow .field.lab{flex:1 1 200px}
    .venue-thumb{width:88px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
    .srow{padding-bottom:12px;border-bottom:1px dashed var(--line)}
    .empty{color:var(--muted);padding:6px 0;margin:0}

    .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
    .pcell{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
    .pcell img{width:100%;height:100%;object-fit:cover;display:block}
    .pcell button{position:absolute;top:4px;right:4px;padding:2px 8px;font-size:12px;background:var(--surface)}

    /* Vista previa */
    .phone{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
    .phone .who{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:13px;color:var(--muted)}
    .phone .who select{width:auto;flex:1;padding:6px 9px}
    .phone .inv{border-radius:12px;overflow:hidden}
    .phone .inv .card{min-height:620px}
    .phone .inv.still .in{animation:none;opacity:1;transform:none}
    .phone .inv.still .rv{opacity:1;transform:none;transition:none}
    .phone .inv .gallery{padding:24px 10px 16px}

    /* Invitados */
    .guests-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin-bottom:14px}
    .guests-head h2{margin:0 0 4px}
    .guests-head .actions{display:flex;flex-wrap:wrap;gap:8px}
    .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
    .stat{flex:1;min-width:130px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--bg)}
    .stat b{display:block;font-size:22px;line-height:1.2;font-variant-numeric:tabular-nums}
    .stat{min-width:0;overflow-wrap:anywhere}
    .stat span{font-size:12px;color:var(--muted)}
    button.stat{display:block;text-align:left;font:inherit;color:inherit;cursor:pointer}
    button.stat:hover{border-color:var(--accent)}
    .subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 14px;overflow-x:auto}
    .subtabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;color:var(--muted);padding:9px 12px;font-weight:600}
    .subtabs button:hover{color:var(--fg);border-color:transparent}
    .subtabs button[aria-current=true]{color:var(--accent);border-bottom-color:var(--accent)}
    .gbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
    .gbar input[type=search]{flex:1 1 220px;width:auto}
    .chips{display:flex;flex-wrap:wrap;gap:6px}
    .chips button{padding:6px 11px;border-radius:999px;font-size:13px;background:var(--bg)}
    .chips button span{color:var(--muted);font-variant-numeric:tabular-nums}
    .chips button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
    .chips button[aria-pressed=true] span{color:inherit;opacity:.8}
    .gview{margin-bottom:14px}
    .gview .hint{margin-top:10px}
    .gtotal{font-size:15px;margin-bottom:12px}
    .gtotal b{font-size:22px;margin-right:4px}
    .gtools{display:flex;flex-wrap:wrap;gap:8px}
    .guest.grow{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
    .guest.grow .field.name{flex:2 1 200px}
    .guest.grow .field.pases{flex:0 0 80px}
    .guest.grow .field.token{flex:3 1 240px}
    .guest.grow .g-status{align-self:center;padding-top:18px}
    .g-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
    .g-head b{font-size:16px}
    .table-wrap{overflow-x:auto}
    table.answers{width:100%;border-collapse:collapse;font-size:14px}
    table.answers th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
    table.answers td{padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
    table.answers tr.guest{display:table-row;padding:0;border-top:0}
    .bulk{border:1px dashed var(--line);border-radius:9px;padding:12px;margin-bottom:14px}
    .guest{border-top:1px solid var(--line);padding:14px 0;display:grid;gap:10px}
    .guest:first-child{border-top:0;padding-top:0}
    .g-status{margin-bottom:-4px}
    .g-top{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
    .g-top .field.name{flex:2 1 200px}
    .g-top .field.pases{flex:0 0 90px}
    .g-top .field.token{flex:3 1 240px}
    .tokenbox{display:flex;align-items:center;gap:4px;border:1px dashed var(--line);border-radius:7px;padding:4px 4px 4px 11px;min-height:42px}
    .tokenbox code{flex:1;min-width:0;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
    .tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
    .tag.si{color:var(--ok);border-color:currentColor}
    .tag.no{color:var(--err);border-color:currentColor}
    .tag.new{color:var(--warn);border-color:currentColor}
    .g-msg{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start}
    .msg{flex:1 1 280px;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
    .msg-acts{display:flex;flex-direction:column;gap:6px}

    .login{max-width:420px;margin:14vh auto 0}
    .login .panel{padding:24px}
    .login h1{margin-bottom:6px}
    .login p{color:var(--muted);margin:0 0 16px}

    .toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:500;font-size:14px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:120}
    .toast.show{opacity:1;transform:translate(-50%,0)}
    @media (prefers-reduced-motion: reduce){.toast{transition:none}}

    @media (max-width:900px){
      .layout{grid-template-columns:minmax(0,1fr)}
      .preview-col{position:static;order:-1;max-height:none;overflow:visible}
      .phone .inv .card{min-height:520px}
      h1{font-size:26px}
    }
  </style>
</head>
<body>
  <div class="app" id="root"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="common.js?v=20261031-2"></script>
  <script>
    document.getElementById("fonts").href = FONTS_HREF;
    const st = document.createElement("style");
    st.textContent = INVITATION_CSS;
    document.head.appendChild(st);

    const $ = (id) => document.getElementById(id);
    const root = $("root");
    const slug = new URLSearchParams(location.search).get("b") || "";
    const KEY_STORE = "edit-key:" + slug;
    const MAX_PHOTOS = 10;

    let editKey = "";
    let S = {}; // configuración de la boda
    let guests = []; // {token, nombre, pases, rsvp, rsvp_pases, rsvp_at, abierta_at, nuevo}
    let dirty = false;
    let viewAs = null;
    let role = "pareja"; // "admin" (super admin) o "pareja"
    const player = createPlayer();

    const store = {
      get: (k) => { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
      set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
      del: (k) => { try { localStorage.removeItem(k); } catch {} },
    };

    let toastTimer;
    function toast(t) {
      const el = $("toast");
      el.textContent = t;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 2000);
    }

    function newToken() {
      const A = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
      return Array.from(crypto.getRandomValues(new Uint8Array(24)), (x) => A[x % A.length]).join("");
    }

    const inviteUrl = (token) => {
      const u = new URL("./", location.href);
      u.search = `?b=${encodeURIComponent(slug)}&g=${encodeURIComponent(token)}`;
      return u.toString();
    };

    // ---------- Acceso ----------
    function showLogin(err) {
      player.stop();
      root.innerHTML = `
        <div class="login"><div class="panel">
          <h1>Editor de invitaciones</h1>
          <p>${slug ? `Boda: <b>${esc(slug)}</b>. ` : ""}Escribe la clave de edición que te dieron.</p>
          <form class="stack">
            <div class="field"><label for="k">Clave de edición</label><input id="k" type="password" autocomplete="current-password" required></div>
            <div><button class="primary" type="submit">Entrar</button></div>
            <p class="hint err" id="loginErr">${esc(err || "")}</p>
          </form>
        </div></div>`;
      if (!slug) {
        $("loginErr").textContent = "Falta la boda en el link (?b=…). Abre el link del editor que te enviaron.";
        root.querySelector("button").disabled = true;
        return;
      }
      root.querySelector("form").onsubmit = async (e) => {
        e.preventDefault();
        const btn = root.querySelector("button");
        btn.disabled = true;
        $("loginErr").textContent = "";
        await tryLoad($("k").value.trim(), true);
        if (btn.isConnected) btn.disabled = false;
      };
    }

    async function tryLoad(k, remember) {
      try {
        const d = await api({ action: "load", slug, editKey: k });
        editKey = k;
        if (remember) store.set(KEY_STORE, k);
        S = normalizeConfig(d.config);
        guests = (d.invitados || []).map((g) => ({ ...g }));
        role = d.role === "admin" ? "admin" : "pareja";
        dirty = false;
        showEditor();
      } catch (err) {
        store.del(KEY_STORE);
        showLogin(err.message);
      }
    }

    // ---------- Editor ----------
    function showEditor() {
      root.innerHTML = `
        <header class="topbar">
          <div class="title"><h1 id="h-title"></h1><span class="badge">${role === "admin" ? "Super admin" : "Pareja"}</span> <span id="status" class="status">Todo guardado</span></div>
          <div class="actions">
            <a class="btn" id="openInv" target="_blank" rel="noopener">Ver como invitado</a>
            <button class="primary" id="save">Guardar cambios</button>
            <button type="button" class="quiet" id="logout">Salir</button>
          </div>
          <nav class="tabs" aria-label="Secciones del editor">
            <button type="button" data-go="evento">Evento</button>
            <button type="button" data-go="diseno">Diseño</button>
            <button type="button" data-go="efectos">Efectos</button>
            <button type="button" data-go="invitados">Invitados y mensajes</button>
            <button type="button" data-go="acceso">Acceso y día del evento</button>
          </nav>
        </header>

        <div class="layout">
          <div class="editor">
            <section class="panel" data-tab="evento" aria-labelledby="h-pareja">
              <h2 id="h-pareja">La pareja y el evento</h2>
              <div class="stack">
                <div class="row">
                  <div class="field"><label for="n1">Nombre 1</label><input type="text" id="n1" data-key="n1" autocomplete="off"></div>
                  <div class="field"><label for="n2">Nombre 2</label><input type="text" id="n2" data-key="n2" autocomplete="off"></div>
                </div>
                <div class="row">
                  <div class="field"><label for="date">Fecha</label><input type="date" id="date" data-key="date"></div>
                  <div class="field"><label for="time">Hora</label><input type="time" id="time" data-key="time"></div>
                </div>
                <div class="row">
                  <div class="field"><label for="venue">Lugar</label><input type="text" id="venue" data-key="venue" autocomplete="off"></div>
                  <div class="field"><label for="city">Ciudad</label><input type="text" id="city" data-key="city" autocomplete="off"></div>
                </div>
                <div class="field"><label for="mapUrl">Enlace de la ubicación (Google Maps)</label><input type="url" id="mapUrl" data-key="mapUrl" autocomplete="off" spellcheck="false" placeholder="https://maps.app.goo.gl/…"></div>
                <div class="field"><label for="address">Dirección del salón</label><input type="text" id="address" data-key="address" autocomplete="off" placeholder="Calle, número, colonia, código postal, ciudad"></div>
                <div class="field"><span class="lbl">Foto del salón (fachada)</span>
                  <div class="swatches">
                    <img id="venue-thumb" class="venue-thumb" alt="Foto del salón" hidden>
                    <label class="upload"><input type="file" id="venue-file" accept="image/jpeg,image/png,image/webp">Subir foto del salón</label>
                    <button type="button" class="quiet" id="venue-remove">Quitar foto</button>
                  </div>
                  <p class="hint" id="venue-msg">Aparece arriba de la ubicación, para que los invitados reconozcan el lugar.</p>
                </div>
                <label class="check"><input type="checkbox" id="parking"> El salón tiene estacionamiento</label>
                <label class="check"><input type="checkbox" id="showMap"> Mostrar el mapa dentro de la invitación</label>
                <div class="field"><label for="note">Frase de la invitación</label><textarea id="note" data-key="note" rows="2" maxlength="300"></textarea></div>
                <div class="field"><span class="lbl">Dirección de la invitación</span><div class="addr" id="addr"></div>
                  <p class="hint">Cada invitado recibe esta dirección con su código propio al final.</p></div>
              </div>
            </section>

            <section class="panel" data-tab="evento" aria-labelledby="h-padres">
              <h2 id="h-padres">Nuestros papás</h2>
              <div class="stack">
                <p class="hint">Aparecen en la invitación bajo “Con la bendición de nuestros papás”. Deja vacío lo que no quieran mostrar.</p>
                <div class="row">
                  <div class="field"><label for="p1a" data-par="1">Papá o mamá de Nombre 1</label><input type="text" id="p1a" data-key="p1a" autocomplete="off"></div>
                  <div class="field"><label for="p1b" data-par="1">Papá o mamá de Nombre 1</label><input type="text" id="p1b" data-key="p1b" autocomplete="off"></div>
                </div>
                <div class="row">
                  <div class="field"><label for="p2a" data-par="2">Papá o mamá de Nombre 2</label><input type="text" id="p2a" data-key="p2a" autocomplete="off"></div>
                  <div class="field"><label for="p2b" data-par="2">Papá o mamá de Nombre 2</label><input type="text" id="p2b" data-key="p2b" autocomplete="off"></div>
                </div>
              </div>
            </section>

            <section class="panel" data-tab="evento" aria-labelledby="h-prog">
              <h2 id="h-prog">Programa del día</h2>
              <p class="hint" style="margin:-6px 0 12px">Cada momento lleva su ícono. En “Automático” se elige por el nombre (Comida → cubiertos, Iglesia → iglesia, Baile → música…).</p>
              <div id="sched-list"></div>
              <button type="button" id="sched-add">Agregar momento</button>
            </section>

            <section class="panel" data-tab="evento" aria-labelledby="h-dress">
              <h2 id="h-dress">Código de vestimenta</h2>
              <div class="stack">
                <label class="check"><input type="checkbox" id="dressOn"> Mostrar el código de vestimenta en la invitación</label>
                <div id="dress-fields" class="stack">
                  <div class="field"><label for="dressType">Tipo</label><input type="text" id="dressType" data-key="dressType" list="dress-opts" autocomplete="off">

              <h2 id="h-song">Canción de fondo</h2>

                <div class="row">
                  <div class="field"><label for="song-src">Canción</label><select id="song-src"></select></div>
                  <div class="field"><label for="song-title">Título que se muestra</label><input type="text" id="song-title" autocomplete="off"></div>
                </div>
                <div class="swatches">
                  <label class="upload"><input type="file" id="song-file" accept="audio/mpeg,audio/mp4,audio/x-m4a,audio/ogg,.mp3,.m4a">Subir canción (MP3)</label>

                </div>
                <p class="hint" id="song-msg">Sube una canción que tengas derecho a usar, de hasta 8 MB. El navegador solo deja sonar música después de un toque, por eso la invitación abre con un botón “Toca para entrar”.</p>
              </div>

            <section class="panel" data-tab="efectos" aria-labelledby="h-fx">
              <h2 id="h-fx">Efectos de la invitación</h2>
              <div class="stack">
                <p class="hint">Cómo aparece cada parte de la invitación cuando el invitado baja. Los cambios se ven al momento en la vista previa.</p>
                <div class="field"><span class="lbl">Animación al bajar</span><div class="seg wrap" id="fx" role="group" aria-label="Animación al bajar"></div></div>
                <div class="field"><span class="lbl">Velocidad</span><div class="seg" id="fxSpeed" role="group" aria-label="Velocidad de la animación"></div></div>
                <div class="field"><span class="lbl">Pantalla de entrada</span><div class="seg" id="intro" role="group" aria-label="Pantalla de entrada"></div></div>
                <div><button type="button" id="intro-test">Ver la entrada</button></div>
                <div class="field"><span class="lbl">Partículas en la portada</span><div class="seg wrap" id="particles" role="group" aria-label="Partículas en la portada"></div></div>
                <label class="check"><input type="checkbox" id="coverIn"> Los nombres y la fecha de la portada aparecen uno por uno</label>
                <label class="check"><input type="checkbox" id="parallax"> El fondo de la portada se mueve más lento al bajar (profundidad)</label>

              <div class="who"><label for="viewas">Ver como</label><select id="viewas"></select></div>
              <div id="preview"></div>
            </div>

        <section class="panel" data-tab="invitados" aria-labelledby="h-inv">
          <div class="guests-head">
            <div><h2 id="h-inv">Invitados</h2><p class="hint" id="summary"></p></div>
          </div>
          <div class="stats" id="stats"></div>

          <nav class="subtabs" aria-label="Secciones de invitados">
            <button type="button" data-gview="lista">Lista de invitados</button>
            <button type="button" data-gview="enviar">Enviar invitaciones</button>
            <button type="button" data-gview="respuestas">Respuestas</button>
            <button type="button" data-gview="confirmados">Confirmados</button>
            <button type="button" data-gview="noasisten">No asistirán</button>
          </nav>

          <div class="gbar">
            <input type="search" id="gq" placeholder="Buscar por nombre…" aria-label="Buscar invitado" autocomplete="off">
            <div class="chips" id="gfilters" role="group" aria-label="Filtrar invitados"></div>
          </div>

          <div class="gview" data-gv="lista">
            <div class="gtools">
              <button type="button" class="primary" id="add">Agregar invitado</button>
              <button type="button" id="bulk-toggle">Pegar lista</button>
            </div>
            <div class="bulk stack" id="bulk" hidden>
              <div class="field"><label for="bulk-txt">Un invitado por línea: nombre, pases (por ejemplo “Familia Pérez, 4”)</label><textarea id="bulk-txt" rows="5"></textarea></div>
              <div><button type="button" class="primary" id="bulk-add">Agregar a la lista</button></div>
            </div>
            <p class="hint">Los invitados nuevos y los links cambiados empiezan a funcionar al tocar “Guardar cambios”. Si alguien necesita cambiar su respuesta, toca “Cambiar” en su link, guarda y envíale el mensaje nuevo.</p>
          </div>

          <div class="gview" data-gv="enviar">
            <div class="msgcfg">
              <div class="field"><label for="template">Estilo del mensaje</label><select id="template" data-key="template"></select></div>
              <label class="check"><input type="checkbox" id="details"> Agregar fecha, lugar y programa debajo del link</label>
              <button type="button" class="primary" id="copy-all">Copiar los mensajes de esta lista</button>
            </div>
          </div>

          <div class="gview" data-gv="respuestas">
            <div class="gtools">
              <button type="button" class="primary" id="refresh">Actualizar respuestas</button>
              <button type="button" id="pdf">Descargar PDF</button>
              <button type="button" id="csv">Descargar lista (Excel)</button>
            </div>
          </div>

          <div class="gview" data-gv="confirmados">
            <div class="gtotal" id="tot-si"></div>
            <div class="gtools">
              <button type="button" id="refresh-si">Actualizar respuestas</button>
              <button type="button" id="copy-si">Copiar lista de confirmados</button>
              <button type="button" id="pdf-si">Descargar PDF</button>
            </div>
          </div>

          <div class="gview" data-gv="noasisten">
            <div class="gtotal" id="tot-no"></div>
            <div class="gtools">
              <button type="button" id="refresh-no">Actualizar respuestas</button>
            </div>
          </div>

          <div id="guests"></div>
        </section>

        <section class="panel" data-tab="acceso" aria-labelledby="h-door">
          <h2 id="h-door">Control de acceso el día de la boda</h2>
          <div class="stack">
            <p class="hint">La persona en la entrada abre la página de control de acceso en su celular, busca a cada invitado y registra cuántas personas llegaron. Cada invitado que confirmó tiene un código QR en su invitación: al escanearlo con la cámara se abre su registro directo. Varias personas pueden usarla a la vez.</p>
            <div class="field"><span class="lbl">Página de control de acceso</span><div class="addr" id="door-url"></div></div>
            <div class="swatches">
              <a class="btn" id="door-open" target="_blank" rel="noopener">Abrir control de acceso</a>
              <button type="button" id="door-key">Generar clave de recepción</button>
              <button type="button" id="door-pdf">Descargar lista en PDF (para papel)</button>
            </div>
            <div id="door-out" class="stack" hidden>
              <div class="field"><span class="lbl">Clave de recepción</span><div class="addr" id="door-val"></div></div>
              <div class="swatches"><button type="button" id="door-copy-msg">Copiar mensaje para recepción</button></div>
              <p class="hint">Esta clave solo deja ver la lista y registrar llegadas; no permite editar la invitación. Cópiala ahora: no se vuelve a mostrar. Al generar otra, la anterior deja de servir.</p>
            </div>
          </div>
        </section>

        ${
          role === "admin"
            ? `<section class="panel" data-tab="acceso" aria-labelledby="h-acceso">
          <h2 id="h-acceso">Acceso de la pareja</h2>
          <div class="stack">
            <p class="hint">Solo tú ves esta sección. Genera la clave de la pareja y entrégasela junto con el link del editor. Al generar una nueva, la anterior deja de servir.</p>
            <div><button type="button" id="new-key">Generar clave nueva para la pareja</button></div>
            <div id="key-out" class="stack" hidden>
              <div class="field"><span class="lbl">Clave de la pareja</span><div class="addr" id="key-val"></div></div>
              <div class="swatches">
                <button type="button" id="key-copy">Copiar clave</button>
                <button type="button" id="key-copy-msg">Copiar mensaje para la pareja</button>
              </div>
              <p class="hint">Cópiala ahora: por seguridad no se vuelve a mostrar. Si se pierde, genera otra.</p>
            </div>
          </div>
        </section>`
            : ""
        }`;

      wireControls();
      syncControls();
      renderSchedule();
      renderPhotos();
      renderGuests();
      renderPreview(true);
      root.querySelectorAll("[data-go]").forEach((b) => (b.onclick = () => showTab(b.dataset.go)));
      const first = location.hash.slice(1) || store.get("editor-tab");
      showTab(root.querySelector(`[data-go="${first}"]`) ? first : "evento");
      measureTop();
    }

    // ---------- Menú ----------
    const TABS_WITH_PREVIEW = ["evento", "diseno", "efectos"];
    function showTab(t) {
      root.querySelectorAll("[data-tab]").forEach((el) => (el.hidden = el.dataset.tab !== t));
      root.querySelector(".layout").hidden = !TABS_WITH_PREVIEW.includes(t);
      root.querySelectorAll("[data-go]").forEach((b) => b.setAttribute("aria-current", String(b.dataset.go === t)));
      store.set("editor-tab", t);
      history.replaceState(null, "", "#" + t);
      window.scrollTo({ top: 0 });
    }
    // La vista previa se pega debajo de la barra de arriba, que cambia de alto según el ancho.
    function measureTop() {
      const h = root.querySelector(".topbar");
      if (h) document.documentElement.style.setProperty("--top-h", h.offsetHeight + 16 + "px");
    }
    window.addEventListener("resize", measureTop);

    function changed() {
      dirty = true;
      const s = $("status");
      if (s) { s.textContent = "Cambios sin guardar"; s.className = "status dirty"; }
    }

    // ---------- Controles ----------
    function parentLabels() {
      root.querySelectorAll("[data-par]").forEach((l) => {
        const who = shortName(l.dataset.par === "1" ? S.n1 : S.n2);
        l.textContent = `Papá o mamá de ${who || "Nombre " + l.dataset.par}`;
      });
    }

    function syncControls() {
      $("h-title").textContent = coupleShort(S) || slug;
      parentLabels();
      root.querySelectorAll("[data-key]").forEach((el) => (el.value = S[el.dataset.key] ?? ""));
      $("details").checked = !!S.details;
      $("addr").textContent = inviteUrl("…").replace(/%E2%80%A6$/, "…");
      $("overlay").value = S.overlay;
      $("overlay-out").textContent = S.overlay + "%";
      root.querySelectorAll("[data-tone]").forEach((b) => b.setAttribute("aria-pressed", String(S.tone === b.dataset.tone)));
      renderSwatches();
      $("img-remove").hidden = !safeUrl(S.image);
      syncMusic();
      $("giftsOn").checked = !!S.giftsOn;
      $("dressOn").checked = !!S.dressOn;
      $("dress-fields").hidden = !S.dressOn;
      $("parking").checked = !!S.parking;
      $("showMap").checked = !!S.showMap;
      const vp = safeUrl(S.venuePhoto);
      $("venue-thumb").hidden = !vp;
      if (vp) $("venue-thumb").src = vp;
      $("venue-remove").hidden = !vp;
      $("gifts-fields").hidden = !S.giftsOn;
      [["fx", S.fx], ["fxSpeed", S.fxSpeed], ["particles", S.particles], ["intro", S.intro]].forEach(([id, v]) =>
        $(id).querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === v)))
      );
      $("coverIn").checked = !!S.coverIn;
      $("parallax").checked = !!S.parallax;
    }

    function renderSwatches() {
      const box = $("swatches");
      box.innerHTML = "";
      Object.entries(PRESETS).forEach(([k, p]) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "sw";
        b.style.background = p.css;
        b.title = p.label;
        b.setAttribute("aria-label", "Fondo " + p.label);
        b.setAttribute("aria-pressed", String(S.bgKind === "preset" && S.preset === k));
        b.onclick = () => { S.bgKind = "preset"; S.preset = k; S.tone = p.tone; changed(); syncControls(); renderPreview(); };
        box.appendChild(b);
      });
      if (safeUrl(S.image)) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "sw";
        b.style.background = `url("${encodeURI(S.image)}") center / cover`;
        b.title = "Mi imagen";
        b.setAttribute("aria-label", "Usar mi imagen");
        b.setAttribute("aria-pressed", String(S.bgKind === "image"));
        b.onclick = () => { S.bgKind = "image"; changed(); syncControls(); renderPreview(); };
        box.appendChild(b);
      }
    }

    function wireControls() {
      $("template").innerHTML = Object.entries(MSG_TEMPLATES).map(([k, t]) => `<option value="${k}">${esc(t.label)}</option>`).join("");

      root.querySelectorAll("[data-key]").forEach((el) =>
        el.addEventListener("input", () => {
          S[el.dataset.key] = el.value;
          changed();
          if (el.dataset.key === "n1" || el.dataset.key === "n2") {
            $("h-title").textContent = coupleShort(S) || slug;
            parentLabels();
          }
          renderPreview();
          updateMessages();
        })
      );
      $("details").onchange = (e) => { S.details = e.target.checked; changed(); updateMessages(); };
      $("overlay").oninput = (e) => { S.overlay = +e.target.value; $("overlay-out").textContent = S.overlay + "%"; changed(); renderPreview(); };
      root.querySelectorAll("[data-tone]").forEach((b) => (b.onclick = () => { S.tone = b.dataset.tone; changed(); syncControls(); renderPreview(); }));
      $("viewas").onchange = (e) => { viewAs = e.target.value; renderPreview(); };

      // Fondo
      $("bg-file").onchange = async (e) => {
        const f = e.target.files[0];
        e.target.value = "";
        if (!f) return;
        const msg = $("bg-msg");
        msg.className = "hint";
        msg.textContent = "Subiendo imagen…";
        try {
          S.image = await uploadImage(f, 2000);
          S.bgKind = "image";
          msg.textContent = "Listo. Ajusta el tono si el texto no se lee bien.";
          changed(); syncControls(); renderPreview();
        } catch (err) {
          msg.className = "hint err";
          msg.textContent = err.message;
        }
      };
      $("img-remove").onclick = () => {
        S.image = null;
        if (S.bgKind === "image") S.bgKind = "preset";
        $("bg-msg").textContent = "Imagen quitada.";
        changed(); syncControls(); renderPreview();
      };

      // Programa
      $("sched-list").addEventListener("input", (e) => {
        const row = e.target.closest(".srow");
        if (!row || !e.target.dataset.s) return;
        S.schedule[Number(row.dataset.i)][e.target.dataset.s] = e.target.value;
        changed(); renderPreview(); updateMessages();
      });
      $("sched-list").addEventListener("click", (e) => {
        const b = e.target.closest("[data-act=sdel]");
        if (!b) return;
        S.schedule.splice(Number(b.closest(".srow").dataset.i), 1);
        changed(); renderSchedule(); renderPreview(); updateMessages();
      });
      $("sched-add").onclick = () => {
        const last = S.schedule[S.schedule.length - 1];
        S.schedule.push({ from: last && last.to ? last.to : "", to: "", label: "", icon: "", place: "" });
        changed(); renderSchedule(); renderPreview();
        const inputs = root.querySelectorAll("#sched-list [data-s=label]");
        inputs[inputs.length - 1]?.focus();
      };

      // Fotos
      $("photos-file").onchange = async (e) => {
        const files = [...e.target.files].filter((f) => /^image\//.test(f.type));
        e.target.value = "";
        const msg = $("photos-msg");
        msg.className = "hint";
        const room = MAX_PHOTOS - S.photos.length;
        if (!files.length) { msg.textContent = "Elige imágenes JPG o PNG."; return; }
        if (room <= 0) { msg.textContent = `Ya hay ${MAX_PHOTOS} fotos. Quita alguna para agregar otra.`; return; }
        const take = files.slice(0, room);
        let ok = 0;
        const errors = [];
        for (let i = 0; i < take.length; i++) {
          msg.textContent = `Subiendo foto ${i + 1} de ${take.length}…`;
          try {
            S.photos.push(await uploadImage(take[i], 1600));
            ok++;
            changed(); renderPhotos(); renderPreview();
          } catch (err) {
            errors.push(`${take[i].name}: ${err.message}`);
          }
        }
        msg.className = errors.length ? "hint err" : "hint";
        msg.textContent =
          `${ok} ${ok === 1 ? "foto agregada." : "fotos agregadas."}` +
          (files.length > take.length ? ` Se agregaron solo las primeras ${take.length} por el límite de ${MAX_PHOTOS}.` : "") +
          (errors.length ? ` No se pudieron subir: ${errors.join(" · ")}` : "");
      };
      $("photos-clear").onclick = () => {
        if (!confirm("¿Quitar todas las fotos de la sesión?")) return;
        S.photos = [];
        $("photos-msg").textContent = "Fotos quitadas.";
        changed(); renderPhotos(); renderPreview();
      };

      // Canción
      $("song-src").onchange = (e) => {
        S.songSrc = e.target.value;
        if (S.songSrc === "demo") S.songTitle = "Melodía de ejemplo";
        changed(); syncMusic(); renderPreview();
      };
      $("song-title").oninput = (e) => { S.songTitle = e.target.value; changed(); renderPreview(); };
      $("volume").oninput = (e) => {
        S.volume = +e.target.value;
        $("volume-out").textContent = S.volume + "%";
        player.setVolume(S.volume / 100);
        changed();
      };
      $("song-file").onchange = async (e) => {
        const f = e.target.files[0];
        e.target.value = "";
        if (!f) return;
        const msg = $("song-msg");
        msg.className = "hint";
        if (f.type && !/^audio\//.test(f.type)) { msg.className = "hint err"; msg.textContent = "Ese archivo no es una canción. Elige un MP3 o M4A."; return; }
        if (f.size > 8 * 1024 * 1024) { msg.className = "hint err"; msg.textContent = `La canción pesa ${Math.round(f.size / 1048576)} MB. El máximo es 8 MB.`; return; }
        msg.textContent = "Subiendo canción…";
        try {
          const type = f.type || (/\.m4a$/i.test(f.name) ? "audio/mp4" : "audio/mpeg");
          const { url } = await api({ action: "upload", slug, editKey, contentType: type, dataBase64: await fileToBase64(f) });
          S.songUrl = url;
          S.songSrc = "file";
          S.songTitle = f.name.replace(/\.[^.]+$/, "");
          msg.textContent = "Canción lista. Toca “Probar canción” para escucharla.";
          changed(); syncMusic(); renderPreview();
        } catch (err) {
          msg.className = "hint err";
          msg.textContent = err.message;
        }
      };
      $("test-song").onclick = () => player.toggle();

      // Invitados
      root.querySelectorAll("[data-gview]").forEach((b) => (b.onclick = () => { gview = b.dataset.gview; store.set("guest-view", gview); renderGuests(); }));
      $("gq").oninput = (e) => { gq = e.target.value; renderGuests(); };
      $("gfilters").addEventListener("click", (e) => {
        const b = e.target.closest("[data-filter]");
        if (!b) return;
        gfilter = b.dataset.filter;
        renderGuests();
      });
      $("stats").addEventListener("click", (e) => {
        const b = e.target.closest("[data-filter]");
        if (!b) return;
        gfilter = b.dataset.filter;
        if (gview === "lista") gview = "respuestas";
        renderGuests();
      });
      $("guests").addEventListener("input", (e) => {
        const g = guestOf(e.target);
        if (!g) return;
        if (e.target.dataset.f === "nombre") g.nombre = e.target.value;
        if (e.target.dataset.f === "pases") g.pases = Math.max(1, Math.min(20, parseInt(e.target.value, 10) || 1));
        changed(); renderViewAs(); renderPreview(); renderSummary();
      });
      $("guests").addEventListener("click", (e) => {
        const b = e.target.closest("[data-act]");
        if (!b) return;
        const g = guestOf(b);
        if (!g) return;
        const act = b.dataset.act;
        if (act === "copy") copyText(messageFor(g), "Mensaje copiado: pégalo en WhatsApp");
        if (act === "copylink") copyText(inviteUrl(g.token), g.nuevo ? "Link copiado. Guarda los cambios para que funcione." : "Link copiado");
        if (act === "regen") {
          if (!g.nuevo && !confirm(`¿Cambiar el link de ${g.nombre || "este invitado"}? El link anterior dejará de funcionar al guardar${g.rsvp ? " y se borrará su confirmación" : ""}.`)) return;
          g.token = newToken();
          g.nuevo = true;
          g.rsvp = null;
          changed(); renderGuests(); renderPreview();
        }
        if (act === "del") {
          if (!g.nuevo && !confirm(`¿Quitar a ${g.nombre || "este invitado"}? Su link dejará de funcionar al guardar.`)) return;
          guests = guests.filter((x) => x !== g);
          changed(); renderGuests(); renderPreview();
        }
      });
      $("add").onclick = () => {
        const g = { token: newToken(), nombre: "", pases: 2, nuevo: true };
        guests.push(g);
        gq = "";
        $("gq").value = "";
        gfilter = "todos";
        changed(); renderGuests(); renderPreview();
        root.querySelector(`.guest[data-token="${g.token}"] [data-f=nombre]`)?.focus();
      };
      $("bulk-toggle").onclick = () => ($("bulk").hidden = !$("bulk").hidden);
      $("bulk-add").onclick = () => {
        const lines = $("bulk-txt").value.split(/\n/).map((l) => l.trim()).filter(Boolean);
        let n = 0;
        for (const l of lines) {
          const m = l.match(/^(.*?)[,;\t]\s*(\d+)\s*(pases?)?$/i);
          const nombre = (m ? m[1] : l).trim().slice(0, 120);
          if (!nombre) continue;
          guests.push({ token: newToken(), nombre, pases: m ? Math.min(20, Math.max(1, Number(m[2]))) : 1, nuevo: true });
          n++;
        }
        $("bulk-txt").value = "";
        $("bulk").hidden = true;
        changed(); renderGuests(); renderPreview();
        toast(`${n} ${n === 1 ? "invitado agregado" : "invitados agregados"}. Guarda para activar sus links.`);
      };
      $("refresh").onclick = refreshAnswers;
      $("refresh-si").onclick = refreshAnswers;
      $("refresh-no").onclick = refreshAnswers;
      $("copy-si").onclick = () => {
        const list = visibleGuests();
        if (!list.length) return toast("Todavía no hay confirmados");
        const people = list.reduce((n, g) => n + (g.rsvp_pases || 0), 0);
        copyText(list.map((g) => `${g.nombre} — ${plural(g.rsvp_pases || 0).replace("pase", "persona")}`).join("\n") + `\n\nTotal: ${people} ${people === 1 ? "persona" : "personas"}`, "Lista de confirmados copiada");
      };
      $("csv").onclick = downloadCsv;
      $("pdf").onclick = printList;
      $("pdf-si").onclick = printList;
      $("door-pdf").onclick = printList;
      const doorUrl = () => {
        const u = new URL("acceso.html", location.href);
        u.search = `?b=${encodeURIComponent(slug)}`;
        return u.toString();
      };
      $("door-url").textContent = doorUrl();
      $("door-open").href = doorUrl();
      $("door-key").onclick = async () => {
        if (!confirm("¿Generar una clave de recepción nueva? Si ya habías dado una, dejará de servir.")) return;
        const btn = $("door-key");
        btn.disabled = true;
        try {
          const { clave } = await api({ action: "clave_recepcion", slug, editKey });
          $("door-val").textContent = clave;
          $("door-out").hidden = false;
          $("door-copy-msg").onclick = () =>
            copyText(`Control de acceso de la boda de ${coupleShort(S)}:\n${doorUrl()}\nClave de recepción: ${clave}\nBusca a cada invitado al llegar y toca "Registrar llegada", o escanea el código QR de su invitación con la cámara.`, "Mensaje copiado");
        } catch (err) {
          toast(err.message);
        }
        btn.disabled = false;
      };
      $("copy-all").onclick = () => {
        const list = visibleGuests().filter((g) => g.nombre.trim());
        if (!list.length) return toast("No hay invitados en esta lista");
        const pending = list.filter((g) => g.nuevo).length;
        copyText(list.map(messageFor).join("\n\n"), pending ? `Copiados. ${pending} links aún sin guardar.` : `${list.length} ${list.length === 1 ? "mensaje copiado" : "mensajes copiados"}`);
      };

      // Efectos
      $("giftsOn").onchange = (e) => { S.giftsOn = e.target.checked; changed(); syncControls(); renderPreview(); };
      ["dressOn", "parking", "showMap"].forEach((k) => ($(k).onchange = (e) => { S[k] = e.target.checked; changed(); syncControls(); renderPreview(); }));
      $("venue-file").onchange = async (e) => {
        const f = e.target.files[0];
        e.target.value = "";
        if (!f) return;
        const msg = $("venue-msg");
        msg.className = "hint";
        msg.textContent = "Subiendo foto…";
        try {
          S.venuePhoto = await uploadImage(f, 1600);
          msg.textContent = "Listo. Así se verá en la sección de ubicación.";
          changed(); syncControls(); renderPreview();
        } catch (err) {
          msg.className = "hint err";
          msg.textContent = err.message;
        }
      };
      $("venue-remove").onclick = () => { S.venuePhoto = null; changed(); syncControls(); renderPreview(); };
      $("intro-test").onclick = () => mountGate(S, null, () => { player.set(S); player.play(); });
      [["fx", FX], ["fxSpeed", FX_SPEED], ["particles", PARTICLES], ["intro", INTROS]].forEach(([id, opts]) => {
        $(id).innerHTML = Object.entries(opts)
          .map(([v, l]) => `<button type="button" data-v="${v}">${esc(Array.isArray(l) ? l[0] : l)}</button>`)
          .join("");
        $(id).querySelectorAll("button").forEach((b) => (b.onclick = () => { S[id] = b.dataset.v; changed(); syncControls(); replayPreview(); }));
      });
      $("coverIn").onchange = (e) => { S.coverIn = e.target.checked; changed(); replayPreview(); };
      $("parallax").onchange = (e) => { S.parallax = e.target.checked; changed(); renderPreview(); };
      $("fx-replay").onclick = replayPreview;

      $("save").onclick = save;
      if (role === "admin") {
        const editorUrl = () => {
          const u = new URL("editar.html", location.href);
          u.search = `?b=${encodeURIComponent(slug)}`;
          return u.toString();
        };
        $("new-key").onclick = async () => {
          if (!confirm("¿Generar una clave nueva para la pareja? La clave que tengan ahora dejará de servir.")) return;
          const btn = $("new-key");
          btn.disabled = true;
          try {
            const { clave } = await api({ action: "clave_pareja", slug, editKey });
            $("key-val").textContent = clave;
            $("key-out").hidden = false;
            $("key-copy").onclick = () => copyText(clave, "Clave copiada");
            $("key-copy-msg").onclick = () =>
              copyText(`Este es el editor de su invitación: ${editorUrl()}\nSu clave de edición: ${clave}\nNo la compartan con nadie más.`, "Mensaje copiado");
          } catch (err) {
            toast(err.message);
          }
          btn.disabled = false;
        };
      }
      $("logout").onclick = () => {
        if (dirty && !confirm("Tienes cambios sin guardar. ¿Salir de todos modos?")) return;
        store.del(KEY_STORE);
        dirty = false;
        editKey = "";
        showLogin();
      };
    }

    // ---------- Programa ----------
    function renderSchedule() {
      const box = $("sched-list");
      if (!S.schedule.length) { box.innerHTML = `<p class="empty">Aún no hay programa. Agrega el primer momento del día.</p>`; return; }
      box.innerHTML = S.schedule
        .map(
          (s, i) => `<div class="srow" data-i="${i}">
            <div class="field"><label>Desde</label><input type="time" data-s="from" value="${esc(s.from)}"></div>
            <div class="field"><label>Hasta</label><input type="time" data-s="to" value="${esc(s.to)}"></div>
            <div class="field lab"><label>Qué sucede</label><input type="text" data-s="label" value="${esc(s.label)}" autocomplete="off" placeholder="Comida, Baile, Pastel…"></div>
            <div class="field"><label>Ícono</label><select data-s="icon">${Object.entries(ICON_LABELS)
              .map(([v, l]) => `<option value="${v}" ${(s.icon || "") === v ? "selected" : ""}>${esc(l)}</option>`)
              .join("")}</select></div>
            <div class="field lab"><label>Lugar (opcional)</label><input type="text" data-s="place" value="${esc(s.place || "")}" autocomplete="off"></div>
            <button type="button" class="quiet" data-act="sdel">Quitar</button></div>`
        )
        .join("");
    }

    // ---------- Fotos ----------
    function renderPhotos() {
      const grid = $("photo-grid");
      grid.innerHTML = S.photos
        .map((u, i) => `<div class="pcell"><img src="${esc(u)}" alt="Foto ${i + 1}"><button type="button" data-i="${i}" aria-label="Quitar foto ${i + 1}">Quitar</button></div>`)
        .join("");
      grid.querySelectorAll("button").forEach((b) => (b.onclick = () => { S.photos.splice(Number(b.dataset.i), 1); changed(); renderPhotos(); renderPreview(); }));
      $("photos-clear").hidden = !S.photos.length;
    }

    // ---------- Música ----------
    function syncMusic() {
      const opts = [["none", "Sin canción"], ["demo", "Melodía de ejemplo"]];
      if (safeUrl(S.songUrl)) opts.push(["file", "Mi canción" + (S.songSrc === "file" && S.songTitle ? ": " + S.songTitle : "")]);
      $("song-src").innerHTML = opts.map(([v, l]) => `<option value="${v}">${esc(l)}</option>`).join("");
      $("song-src").value = S.songSrc;
      $("song-title").value = S.songTitle || "";
      $("song-title").disabled = S.songSrc === "none";
      $("volume").value = S.volume;
      $("volume-out").textContent = S.volume + "%";
      player.set(S);
      paintMusic();
    }

    function paintMusic() {
      const t = $("test-song");
      if (!t) return;
      t.textContent = player.playing ? "Pausar" : "Probar canción";
      t.disabled = S.songSrc === "none";
      const mb = root.querySelector("#preview .music-btn");
      if (mb) {
        mb.setAttribute("aria-pressed", String(player.playing));
        mb.textContent = player.playing ? "❚❚ Pausar" : "♪ Reproducir";
      }
    }

    // ---------- Vista previa ----------
    // Vuelve a dibujar la vista previa desde arriba para que se vean las animaciones de nuevo.
    function replayPreview() {
      const col = root.querySelector(".preview-col");
      if (col) col.scrollTop = 0;
      renderPreview(true);
    }

    function renderViewAs() {
      const sel = $("viewas");
      const list = guests.length ? guests : [{ token: "", nombre: "Nombre del invitado", pases: 2 }];
      sel.innerHTML = list.map((g) => `<option value="${esc(g.token)}">${esc(g.nombre.trim() || "Sin nombre")}</option>`).join("");
      if (list.some((g) => g.token === viewAs)) sel.value = viewAs;
      else viewAs = sel.value;
    }

    // Mientras se escribe, la vista previa se actualiza sin repetir las animaciones;
    // `animate` las vuelve a correr (al cargar, al cambiar un efecto o con "Ver la animación otra vez").
    function renderPreview(animate) {
      renderViewAs();
      const g = guests.find((x) => x.token === viewAs) || guests[0] || { nombre: "Nombre del invitado", pases: 2 };
      const p = $("preview");
      p.innerHTML = renderInvitation(S, g);
      if (!animate) p.querySelector(".inv").classList.add("still");
      p.querySelector(".rsvp-cta")?.addEventListener("click", (e) => {
        e.preventDefault();
        toast("En la invitación real, este botón lleva al formulario para confirmar");
      });
      wireInvitation(p, S, player);
      player.onchange = paintMusic;
      paintMusic();
      const a = $("openInv");
      const saved = guests.find((x) => x.token === viewAs && !x.nuevo) || guests.find((x) => !x.nuevo);
      a.hidden = !saved;
      if (saved) a.href = inviteUrl(saved.token);
    }

    // ---------- Invitados ----------
    const GVIEWS = ["lista", "enviar", "respuestas", "confirmados", "noasisten"];
    let gview = GVIEWS.includes(store.get("guest-view")) ? store.get("guest-view") : "lista";
    let gfilter = "todos";
    let gq = "";

    const STATES = {
      todos: ["Todos", () => true],
      si: ["Asistirán", (g) => !g.nuevo && g.rsvp === "si"],
      no: ["No asistirán", (g) => !g.nuevo && g.rsvp === "no"],
      pend: ["Sin responder", (g) => !g.nuevo && !g.rsvp],
      noabre: ["Sin abrir", (g) => !g.nuevo && !g.rsvp && !g.abierta_at],
      nuevo: ["Sin guardar", (g) => g.nuevo],
    };

    function guestOf(el) {
      const row = el.closest(".guest");
      return row ? guests.find((g) => g.token === row.dataset.token) : null;
    }

    function statusTag(g) {
      if (g.nuevo) return `<span class="tag new">Link sin guardar</span>`;
      if (g.rsvp === "si") return `<span class="tag si">Asistirá · ${plural(g.rsvp_pases || 0)}</span>`;
      if (g.rsvp === "no") return `<span class="tag no">No asistirá</span>`;
      return `<span class="tag">${g.abierta_at ? "Abrió, sin responder" : "Sin abrir"}</span>`;
    }

    const fold = (t) => String(t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
    // Confirmados y No asistirán tienen su propio filtro fijo; las demás vistas usan los chips.
    function visibleGuests() {
      const q = fold(gq).trim();
      const f = gview === "confirmados" ? STATES.si[1] : gview === "noasisten" ? STATES.no[1] : STATES[gfilter][1];
      return guests.filter((g) => f(g) && (!q || fold(g.nombre).includes(q)));
    }

    function renderGuests() {
      root.querySelectorAll("[data-gview]").forEach((b) => b.setAttribute("aria-current", String(b.dataset.gview === gview)));
      root.querySelectorAll("[data-gv]").forEach((el) => (el.hidden = el.dataset.gv !== gview));
      $("gfilters").innerHTML = Object.entries(STATES)
        .filter(([k]) => k !== "nuevo" || guests.some((g) => g.nuevo))
        .map(([k, [label, fn]]) => `<button type="button" data-filter="${k}" aria-pressed="${k === gfilter}">${label} <span>${guests.filter(fn).length}</span></button>`)
        .join("");
      if (gfilter === "nuevo" && !guests.some((g) => g.nuevo)) gfilter = "todos";

      $("gfilters").hidden = gview === "confirmados" || gview === "noasisten";
      const si = guests.filter(STATES.si[1]), no = guests.filter(STATES.no[1]);
      const people = si.reduce((n, g) => n + (g.rsvp_pases || 0), 0);
      const assigned = si.reduce((n, g) => n + (Number(g.pases) || 0), 0);
      $("tot-si").innerHTML = `<b>${people}</b> ${people === 1 ? "persona confirmada" : "personas confirmadas"} en ${si.length} ${si.length === 1 ? "invitación" : "invitaciones"}` +
        (assigned > people ? ` <span class="hint">· ${assigned - people} de sus pases no se usarán</span>` : "");
      const freed = no.reduce((n, g) => n + (Number(g.pases) || 0), 0);
      $("tot-no").innerHTML = `<b>${no.length}</b> ${no.length === 1 ? "invitación dijo" : "invitaciones dijeron"} que no asistirán <span class="hint">· ${plural(freed)} liberados</span>`;

      const list = visibleGuests();
      const box = $("guests");
      if (!guests.length) box.innerHTML = `<p class="empty">Aún no hay invitados. Toca “Agregar invitado” o “Pegar lista”.</p>`;
      else if (!list.length && gview === "confirmados") box.innerHTML = `<p class="empty">${gq ? "Nadie coincide con la búsqueda." : "Todavía nadie ha confirmado."}</p>`;
      else if (!list.length && gview === "noasisten") box.innerHTML = `<p class="empty">${gq ? "Nadie coincide con la búsqueda." : "Nadie ha dicho que no asistirá."}</p>`;
      else if (!list.length) box.innerHTML = `<p class="empty">Nadie coincide con la búsqueda o el filtro.</p>`;
      else if (gview === "lista") box.innerHTML = list.map(listRow).join("");
      else if (gview === "enviar") box.innerHTML = list.map(sendRow).join("");
      else if (gview === "confirmados") box.innerHTML = yesTable(list);
      else if (gview === "noasisten") box.innerHTML = noTable(list);
      else box.innerHTML = answersTable(list);
      updateMessages();
    }

    function listRow(g) {
      return `<div class="guest grow" data-token="${esc(g.token)}">
        <div class="field name"><label>Nombre o familia</label><input type="text" data-f="nombre" value="${esc(g.nombre)}" maxlength="120" autocomplete="off"></div>
        <div class="field pases"><label>Pases</label><input type="number" data-f="pases" min="1" max="20" inputmode="numeric" value="${g.pases}"></div>
        <div class="field token"><span class="lbl">Link único</span><div class="tokenbox"><code>${esc(g.token)}</code><button type="button" class="quiet" data-act="regen" title="Generar otro link. Úsalo si el invitado necesita cambiar su respuesta">Cambiar</button></div></div>
        <div class="g-status">${statusTag(g)}</div>
        <button type="button" class="quiet" data-act="del">Quitar</button>
      </div>`;
    }

    function sendRow(g) {
      return `<div class="guest" data-token="${esc(g.token)}">
        <div class="g-head"><b>${esc(g.nombre || "Sin nombre")}</b> <span class="hint">${plural(Number(g.pases) || 1)}</span> <span class="g-status">${statusTag(g)}</span></div>
        <div class="g-msg"><div class="msg"></div>
          <div class="msg-acts">
            <a class="btn primary" data-wa target="_blank" rel="noopener">Enviar por WhatsApp</a>
            <button type="button" data-act="copy" title="Copia el saludo y el link, para pegarlo en WhatsApp">Copiar mensaje</button>
            <button type="button" data-act="copylink" title="Copia solo el link">Copiar link</button>
            <a class="btn" data-open target="_blank" rel="noopener">Abrir invitación</a>
          </div>
        </div>
      </div>`;
    }

    function answersTable(list) {
      const when = (iso) => (iso ? new Date(iso).toLocaleString("es-MX", { dateStyle: "short", timeStyle: "short" }) : "—");
      return `<div class="table-wrap"><table class="answers">
        <thead><tr><th>Invitado</th><th>Pases</th><th>Respuesta</th><th>Personas</th><th>Respondió</th><th>Abrió</th></tr></thead>
        <tbody>${list
          .map(
            (g) => `<tr class="guest" data-token="${esc(g.token)}">
            <td>${esc(g.nombre)}</td><td>${g.pases}</td><td class="g-status">${statusTag(g)}</td>
            <td>${g.rsvp === "si" ? g.rsvp_pases : "—"}</td><td>${when(g.rsvp_at)}</td><td>${when(g.abierta_at)}</td></tr>`
          )
          .join("")}</tbody></table></div>`;
    }

    const whenShort = (iso) => (iso ? new Date(iso).toLocaleString("es-MX", { dateStyle: "short", timeStyle: "short" }) : "—");

    function yesTable(list) {
      return `<div class="table-wrap"><table class="answers">
        <thead><tr><th>Invitado</th><th>Personas</th><th>Pases asignados</th><th>Confirmó</th><th>Llegó al evento</th></tr></thead>
        <tbody>${list
          .map((g) => `<tr class="guest" data-token="${esc(g.token)}"><td>${esc(g.nombre)}</td><td><b>${g.rsvp_pases}</b></td><td>${g.pases}</td><td>${whenShort(g.rsvp_at)}</td><td>${g.llegaron ? `<span class="tag si">${g.llegaron} · ${new Date(g.llegada_at).toLocaleTimeString("es-MX", { hour: "numeric", minute: "2-digit" })}</span>` : "—"}</td></tr>`)
          .join("")}</tbody></table></div>`;
    }

    function noTable(list) {
      return `<div class="table-wrap"><table class="answers">
        <thead><tr><th>Invitado</th><th>Pases liberados</th><th>Respondió</th><th></th></tr></thead>
        <tbody>${list
          .map(
            (g) => `<tr class="guest" data-token="${esc(g.token)}"><td>${esc(g.nombre)}</td><td>${g.pases}</td><td>${whenShort(g.rsvp_at)}</td>
            <td><button type="button" class="quiet" data-act="regen" title="Darle un link nuevo para que vuelva a responder">Dejar responder de nuevo</button></td></tr>`
          )
          .join("")}</tbody></table></div>`;
    }

    function messageFor(g) {
      return buildMessage(S, g, inviteUrl(g.token));
    }

    function updateMessages() {
      guests.forEach((g) => {
        const row = root.querySelector(`.guest[data-token="${g.token}"]`);
        if (!row || !row.querySelector(".msg")) return;
        const m = messageFor(g);
        row.querySelector(".msg").textContent = m;
        const wa = row.querySelector("[data-wa]");
        wa.href = "https://wa.me/?text=" + encodeURIComponent(m);
        wa.hidden = !!g.nuevo;
        const open = row.querySelector("[data-open]");
        open.href = inviteUrl(g.token);
        open.hidden = !!g.nuevo;
      });
      renderSummary();
    }

    function renderSummary() {
      const total = guests.reduce((n, g) => n + (Number(g.pases) || 0), 0);
      $("summary").textContent = `${guests.length} ${guests.length === 1 ? "invitación" : "invitaciones"} · ${plural(total)} en total`;
      renderStats();
    }

    // Trae las respuestas nuevas sin tocar lo que se esté editando (nombres, pases, invitados sin guardar).
    async function refreshAnswers(e) {
      const btn = e?.currentTarget || $("refresh");
      btn.disabled = true;
      try {
        const d = await api({ action: "load", slug, editKey });
        const byToken = new Map((d.invitados || []).map((g) => [g.token, g]));
        let nuevas = 0;
        guests.forEach((g) => {
          const r = byToken.get(g.token);
          if (!r || g.nuevo) return;
          if (r.rsvp !== g.rsvp || r.rsvp_pases !== g.rsvp_pases) nuevas++;
          Object.assign(g, { rsvp: r.rsvp, rsvp_pases: r.rsvp_pases, rsvp_at: r.rsvp_at, abierta_at: r.abierta_at, llegada_at: r.llegada_at, llegaron: r.llegaron });
        });
        if (gview === "lista") {
          guests.forEach((g) => {
            const row = root.querySelector(`.guest[data-token="${g.token}"] .g-status`);
            if (row) row.innerHTML = statusTag(g);
          });
          renderSummary();
        } else renderGuests();
        toast(nuevas ? `${nuevas} ${nuevas === 1 ? "respuesta nueva" : "respuestas nuevas"}` : "No hay respuestas nuevas");
      } catch (err) {
        toast(err.message);
      }
      btn.disabled = false;
    }

    // Lista para imprimir o guardar como PDF (el navegador ofrece "Guardar como PDF" al imprimir).
    function printList() {
      const saved = guests.filter((g) => !g.nuevo);
      if (!saved.length) return toast("Guarda a tus invitados para hacer el PDF");
      const by = (a, b) => a.nombre.localeCompare(b.nombre, "es");
      const si = saved.filter((g) => g.rsvp === "si").sort(by);
      const no = saved.filter((g) => g.rsvp === "no").sort(by);
      const pend = saved.filter((g) => !g.rsvp).sort(by);
      const people = si.reduce((n, g) => n + (g.rsvp_pases || 0), 0);
      const d = parseDate(S.date);
      const rows = (list, cols) => list.map((g, i) => `<tr>${cols(g, i)}</tr>`).join("");
      const box = `<span class="box"></span>`;
      const html = `<!doctype html><html lang="es"><head><meta charset="utf-8">
        <title>Invitados · ${esc(coupleShort(S))}</title>
        <link rel="stylesheet" href="${FONTS_HREF}">
        <style>
          @page{size:letter;margin:16mm 14mm}
          *{box-sizing:border-box}
          body{margin:0;font:11pt/1.4 'Figtree',system-ui,sans-serif;color:#1A1B2E;-webkit-print-color-adjust:exact;print-color-adjust:exact}
          header{text-align:center;padding-bottom:14px;border-bottom:1px solid #E6E2DA;margin-bottom:16px}
          .k{font-size:8pt;letter-spacing:.3em;text-transform:uppercase;color:#A8325A;margin:0}
          h1{font:600 28pt/1.1 'Cormorant Garamond',Georgia,serif;margin:6px 0 4px}
          .sub{color:#5E6180;margin:0}
          .sum{display:flex;gap:10px;margin:0 0 18px}
          .sum div{flex:1;border:1px solid #E6E2DA;border-radius:10px;padding:8px 12px;background:#FBFAF7}
          .sum b{display:block;font-size:18pt}
          .sum span{font-size:8.5pt;color:#5E6180}
          h2{font:600 15pt 'Cormorant Garamond',Georgia,serif;margin:18px 0 6px;color:#A8325A}
          table{width:100%;border-collapse:collapse}
          th{text-align:left;font-size:8pt;letter-spacing:.12em;text-transform:uppercase;color:#5E6180;border-bottom:1.5px solid #1A1B2E;padding:6px}
          td{padding:7px 6px;border-bottom:1px solid #E6E2DA;vertical-align:middle}
          tr{break-inside:avoid}
          .n{width:28px;color:#5E6180}
          .num{text-align:center;width:80px}
          .box{display:inline-block;width:14px;height:14px;border:1.5px solid #1A1B2E;border-radius:3px}
          .chk{width:60px;text-align:center}
          footer{margin-top:24px;text-align:center;font-size:8pt;color:#5E6180}
          .tip{font-size:9pt;color:#5E6180;margin:0 0 6px}
        </style></head><body>
        <header><p class="k">Lista de invitados</p><h1>${esc(coupleShort(S))}</h1>
          <p class="sub">${[d ? cap(fmtLong.format(d)) : "", S.time ? S.time + " h" : "", S.venue].filter(Boolean).map(esc).join(" · ")}</p></header>
        <div class="sum">
          <div><b>${people}</b><span>personas confirmadas</span></div>
          <div><b>${si.length}</b><span>invitaciones confirmadas</span></div>
          <div><b>${pend.length}</b><span>sin responder</span></div>
          <div><b>${no.length}</b><span>no asistirán</span></div>
        </div>
        <h2>Confirmados</h2>
        <p class="tip">Marca la casilla cuando llegue cada invitación.</p>
        <table><thead><tr><th class="n">#</th><th>Invitado</th><th class="num">Personas</th><th class="num">Pases</th><th class="chk">Llegó</th></tr></thead>
          <tbody>${rows(si, (g, i) => `<td class="n">${i + 1}</td><td>${esc(g.nombre)}</td><td class="num"><b>${g.rsvp_pases}</b></td><td class="num">${g.pases}</td><td class="chk">${box}</td>`)}</tbody></table>
        ${pend.length ? `<h2>Sin responder</h2><table><thead><tr><th class="n">#</th><th>Invitado</th><th class="num">Pases</th><th class="chk">Llegó</th></tr></thead>
          <tbody>${rows(pend, (g, i) => `<td class="n">${i + 1}</td><td>${esc(g.nombre)}</td><td class="num">${g.pases}</td><td class="chk">${box}</td>`)}</tbody></table>` : ""}
        ${no.length ? `<h2>No asistirán</h2><table><thead><tr><th class="n">#</th><th>Invitado</th><th class="num">Pases</th></tr></thead>
          <tbody>${rows(no, (g, i) => `<td class="n">${i + 1}</td><td>${esc(g.nombre)}</td><td class="num">${g.pases}</td>`)}</tbody></table>` : ""}
        <footer>Generado el ${esc(new Date().toLocaleString("es-MX", { dateStyle: "long", timeStyle: "short" }))}</footer>
        <script>document.fonts.ready.then(() => setTimeout(() => print(), 300));<\/script>
        </body></html>`;
      const w = window.open("", "_blank");
      if (!w) return toast("Tu navegador bloqueó la ventana. Permite ventanas emergentes e intenta otra vez.");
      w.document.open();
      w.document.write(html);
      w.document.close();
    }

    function downloadCsv() {
      const saved = guests.filter((g) => !g.nuevo);
      if (!saved.length) return toast("Guarda a tus invitados para descargar la lista");
      const when = (iso) => (iso ? new Date(iso).toLocaleString("es-MX", { dateStyle: "short", timeStyle: "short" }) : "");
      const resp = (g) => (g.rsvp === "si" ? "Asistirá" : g.rsvp === "no" ? "No asistirá" : g.abierta_at ? "Abrió, sin responder" : "Sin abrir");
      const rows = [["Nombre", "Pases asignados", "Respuesta", "Personas confirmadas", "Fecha de respuesta", "Abrió la invitación", "Link"]];
      saved.forEach((g) =>
        rows.push([g.nombre, g.pases, resp(g), g.rsvp === "si" ? g.rsvp_pases : 0, when(g.rsvp_at), when(g.abierta_at), inviteUrl(g.token)])
      );
      const total = saved.filter((g) => g.rsvp === "si").reduce((n, g) => n + (g.rsvp_pases || 0), 0);
      rows.push([], ["Total de personas confirmadas", "", "", total]);
      const cell = (v) => {
        let t = String(v ?? "");
        if (/^[=+\-@]/.test(t)) t = "'" + t; // que Excel no lo tome como fórmula
        return /[",\n;]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t;
      };
      // El BOM hace que Excel lea bien los acentos.
      const csv = "\uFEFF" + rows.map((r) => r.map(cell).join(",")).join("\r\n");
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
      a.download = `invitados-${slug}.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }

    function renderStats() {
      const saved = guests.filter((g) => !g.nuevo);
      const si = saved.filter((g) => g.rsvp === "si");
      const no = saved.filter((g) => g.rsvp === "no");
      const pend = saved.filter((g) => !g.rsvp);
      const people = si.reduce((n, g) => n + (g.rsvp_pases || 0), 0);
      $("stats").innerHTML = `
        <button type="button" class="stat" data-filter="si"><b>${people}</b><span>personas confirmadas (${si.length} ${si.length === 1 ? "invitación" : "invitaciones"})</span></button>
        <button type="button" class="stat" data-filter="no"><b>${no.length}</b><span>no asistirán</span></button>
        <button type="button" class="stat" data-filter="pend"><b>${pend.length}</b><span>sin responder</span></button>
        <button type="button" class="stat" data-filter="noabre"><b>${saved.filter((g) => !g.rsvp && !g.abierta_at).length}</b><span>no han abierto su invitación</span></button>`;
    }

    async function copyText(text, done) {
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
      }
      toast(done);
    }

    // ---------- Subidas ----------
    function fileToBase64(file) {
      return new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(String(r.result).split(",")[1]);
        r.onerror = () => rej(new Error("No se pudo leer el archivo"));
        r.readAsDataURL(file);
      });
    }

    async function uploadImage(file, maxSide) {
      if (!/^image\//.test(file.type)) throw new Error("No es una imagen");
      const img = await new Promise((res, rej) => {
        const i = new Image();
        i.onload = () => res(i);
        i.onerror = () => rej(new Error("No se pudo abrir la imagen"));
        i.src = URL.createObjectURL(file);
      });
      const k = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.round(img.naturalWidth * k);
      c.height = Math.round(img.naturalHeight * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      const b64 = c.toDataURL("image/jpeg", 0.85).split(",")[1];
      const { url } = await api({ action: "upload", slug, editKey, contentType: "image/jpeg", dataBase64: b64 });
      return url;
    }

    // ---------- Guardar ----------
    async function save() {
      const btn = $("save");
      const s = $("status");
      if (guests.some((g) => !g.nombre.trim())) {
        s.textContent = "Hay un invitado sin nombre";
        s.className = "status err";
        return;
      }
      btn.disabled = true;
      s.textContent = "Guardando…";
      s.className = "status";
      try {
        await api({
          action: "save",
          slug,
          editKey,
          config: S,
          invitados: guests.map((g) => ({ token: g.token, nombre: g.nombre.trim(), pases: Number(g.pases) || 1 })),
        });
        const d = await api({ action: "load", slug, editKey });
        guests = (d.invitados || []).map((g) => ({ ...g }));
        dirty = false;
        s.textContent = "Todo guardado";
        renderGuests();
        renderPreview();
        toast("Cambios guardados");
      } catch (err) {
        s.textContent = err.message;
        s.className = "status err";
      }
      btn.disabled = false;
    }

    window.addEventListener("beforeunload", (e) => {
      if (dirty) { e.preventDefault(); e.returnValue = ""; }
    });

    const savedKey = store.get(KEY_STORE);
    if (slug && savedKey) tryLoad(savedKey, false);
    else showLogin();
  </script>
</body>
</html>
